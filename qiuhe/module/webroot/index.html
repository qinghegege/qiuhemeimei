<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>清荷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#FFF0F5,#FFE4E1,#FFD6E0);color:#5D4E5F;min-height:100vh}
.hd{background:linear-gradient(135deg,#FF6B9D,#FF85AB);padding:18px 16px 14px;text-align:center;position:relative;box-shadow:0 2px 12px rgba(255,107,157,0.25)}
.hd .rb{font-size:28px;display:block;margin-bottom:2px}
.hd h1{font-size:20px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,0.1)}
.hd s{font-size:11px;color:rgba(255,255,255,0.8)}
.ct{padding:10px 14px 70px;max-width:460px;margin:0 auto}
.dh{text-align:center;font-size:12px;letter-spacing:3px;margin:6px 0;color:#FFB8CC}

.gc{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(255,107,157,0.06);border:1px solid #FFE4EC;cursor:pointer;transition:transform .12s}
.gc:active{transform:scale(0.98)}
.gt{display:flex;align-items:center;gap:10px}
.gi{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.gn{font-size:14px;font-weight:600;color:#5D4E5F}
.gm{font-size:10px;color:#B8A9C6;margin-top:1px}
.bdg{font-size:9px;padding:2px 7px;border-radius:6px;font-weight:500}
.bok{background:#E8F5E9;color:#66BB6A}
.bno{background:#F5F5F5;color:#C0B8C8}
.arr{font-size:18px;color:#D4C4E0;margin-left:auto}

.dtl{display:none}
.dtl.on{display:block}
.db{display:flex;align-items:center;gap:4px;font-size:13px;color:#FF6B9D;margin-bottom:12px;cursor:pointer;font-weight:500}
.db:active{opacity:.7}

.btn{display:block;width:100%;padding:13px;border:none;border-radius:13px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:opacity .12s;margin-bottom:7px}
.btn:active{opacity:.75}
.bp{background:linear-gradient(135deg,#FF6B9D,#FF85AB);color:#fff;box-shadow:0 3px 10px rgba(255,107,157,0.25)}
.bm{background:linear-gradient(135deg,#98D8C8,#7EC8B0);color:#fff;box-shadow:0 3px 10px rgba(152,216,200,0.25)}
.bc{background:linear-gradient(135deg,#FF8A80,#FF6E60);color:#fff;box-shadow:0 3px 8px rgba(255,138,128,0.2)}
.bw{background:#fff;color:#FF6B9D;border:2px solid #FFE4EC}
.bsm{padding:9px 13px;font-size:12px;border-radius:8px;display:inline-block;width:auto;margin:0}

.as{margin-top:12px}
.ast{font-size:12px;color:#B8A9C6;font-weight:600;margin-bottom:6px}
.ai{background:#fff;border-radius:11px;padding:12px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;border:1px solid #FFE4EC}
.ail{flex:1;min-width:0}
.aan{font-size:14px;font-weight:600;color:#5D4E5F}
.aam{font-size:9px;color:#C0B8C8;margin-top:1px}
.aia{display:flex;gap:5px;flex-shrink:0}

.emp{text-align:center;padding:30px 0;color:#C0B8C8}
.emp .em{font-size:40px}
.emp .tx{font-size:13px;line-height:1.6;margin-top:6px}

.ld{text-align:center;padding:30px 0}
.sp{display:inline-block;width:22px;height:22px;border:3px solid #FFE4EC;border-top-color:#FF6B9D;border-radius:50%;animation:s .8s linear infinite;margin-bottom:6px}
@keyframes s{to{transform:rotate(360deg)}}
.lt{font-size:12px;color:#C0B8C8}

.tst{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:22px;font-size:12px;z-index:9;opacity:0;transition:.3s;font-weight:500}
.tst.on{opacity:1}
.tst.ok{background:#98D8C8;color:#fff}
.tst.er{background:#FF8A80;color:#fff}
.tst.in{background:rgba(0,0,0,0.75);color:#fff}

.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:7;display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
.md{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px 16px 24px;max-height:65vh;overflow-y:auto}
.md h3{font-size:16px;color:#5D4E5F;margin-bottom:4px;font-weight:700}
.md p{font-size:12px;color:#B8A9C6;margin-bottom:12px}
.md input{width:100%;padding:10px 12px;border:2px solid #FFE4EC;border-radius:10px;font-size:14px;color:#5D4E5F;outline:none;background:#FFF8FA;margin-bottom:10px}
.md input:focus{border-color:#FF6B9D}
.cf{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:10;display:none;align-items:center;justify-content:center}
.cf.on{display:flex}
.cb{background:#fff;border-radius:14px;padding:22px 18px;text-align:center;width:270px}
.cb h3{font-size:15px;color:#5D4E5F;margin-bottom:6px}
.cb p{font-size:12px;color:#B8A9C6;margin-bottom:16px;line-height:1.4}
.cr{display:flex;gap:7px}

.fab{position:fixed;bottom:18px;right:14px;width:46px;height:46px;border-radius:23px;background:linear-gradient(135deg,#FF6B9D,#FF85AB);color:#fff;font-size:22px;border:none;box-shadow:0 3px 12px rgba(255,107,157,0.3);cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab:active{transform:scale(0.9)}

.aip{position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF5F7;z-index:6;display:none;flex-direction:column}
.aip.on{display:flex}
.aih{background:linear-gradient(135deg,#FF6B9D,#FF85AB);padding:12px 14px;display:flex;align-items:center;gap:8px;color:#fff}
.aih .ab{font-size:18px;cursor:pointer;padding:2px}
.aih .at{font-size:15px;font-weight:600;flex:1}
.ach{flex:1;overflow-y:auto;padding:10px 12px}
.abb{max-width:85%;padding:9px 12px;border-radius:12px;font-size:12px;line-height:1.4;margin-bottom:8px;word-break:break-word}
.abb.u{margin-left:auto;background:#FF6B9D;color:#fff;border-bottom-right-radius:3px}
.abb.b{background:#fff;color:#5D4E5F;border-bottom-left-radius:3px;box-shadow:0 1px 3px rgba(255,107,157,0.04)}
.abb.e{background:#FFE0E0;color:#C0392B}
.ain{display:flex;gap:6px;padding:8px 12px;border-top:1px solid #FFE4EC;background:#fff}
.ain input{flex:1;padding:9px 12px;border:2px solid #FFE4EC;border-radius:18px;font-size:13px;outline:none;background:#FFF8FA;color:#5D4E5F}
.ain input:focus{border-color:#FF6B9D}
.aic{margin:6px 12px;padding:8px 10px;background:#fff;border-radius:10px;display:none;border:1px solid #FFE4EC}
.aic.on{display:block}
.aic input{width:100%;padding:7px 8px;border:1px solid #FFE4EC;border-radius:7px;font-size:12px;margin:4px 0;outline:none;background:#FFF8FA}
.aic input:focus{border-color:#FF6B9D}
</style>
</head>
<body>

<div class="hd"><span class="rb">🎀</span><h1>清荷</h1><s>腾讯手游账号切换 · Hello Kitty</s></div>

<div class="ct">
  <div id="pg"><div class="dh">♥ ♥ ♥</div><div id="gl"><div class="ld"><div class="sp"></div><div class="lt">正在检测游戏...</div></div></div></div>
  <div id="pd" class="dtl">
    <div class="db" onclick="back()">← 返回游戏列表</div>
    <div style="font-size:18px;font-weight:700;color:#5D4E5F;margin-bottom:2px" id="dn"></div>
    <div style="font-size:11px;color:#B8A9C6;margin-bottom:14px" id="dm"></div>
    <div id="dc"></div>
  </div>
</div>

<button class="fab" onclick="aiOpen()">✨</button>

<div class="aip" id="aip">
  <div class="aih">
    <span class="ab" onclick="aiClose()">←</span><span class="at">AI 助手</span>
    <button class="btn bsm bw" style="margin:0;padding:4px 8px;font-size:10px" onclick="document.getElementById('aicf').classList.toggle('on')">⚙</button>
  </div>
  <div class="aic" id="aicf">
    <div style="font-size:11px;color:#B8A9C6;margin-bottom:2px">DeepSeek API Key</div>
    <input type="password" id="aik" placeholder="sk-xxxxxxxx">
    <div style="display:flex;gap:5px;margin-top:3px">
      <button class="btn bp bsm" style="margin:0" onclick="aiSave()">保存</button>
      <button class="btn bc bsm" style="margin:0" onclick="aiDelCfg()">清除</button>
    </div>
  </div>
  <div class="ach" id="ach">
    <div class="abb b">你好呀~ 我是清荷 AI 助手 💕<br><br>配置 DeepSeek API Key 后，就可以用自然语言管理账号啦。</div>
  </div>
  <div class="ain">
    <input type="text" id="ait" placeholder="比如: 切换到王者荣耀大号" onkeydown="if(event.key==='Enter')aiSend()">
    <button class="btn bp" style="width:auto;margin:0;padding:9px 16px;border-radius:18px;font-size:13px" onclick="aiSend()">发送</button>
  </div>
</div>

<div class="mo" id="mo"><div class="md" id="md"></div></div>
<div class="cf" id="cfo"><div class="cb"><h3 id="cft"></h3><p id="cfm"></p><div class="cr"><button class="btn bw" style="flex:1;margin:0" onclick="cfClose(false)">取消</button><button class="btn bp" style="flex:1;margin:0" id="cfk">确认</button></div></div></div>
<div id="t" class="tst"></div>

<script>
var API='http://127.0.0.1:8848/cgi-bin/api';
var cg=null,cgd='',cgpt='',cgcl=false,aiOk=false;

function toast(m,c){var t=document.getElementById('t');t.className='tst '+(c||'in')+' on';t.textContent=m;setTimeout(function(){t.classList.remove('on')},2000)}
function cfShow(tt,mm,cb){document.getElementById('cft').textContent=tt;document.getElementById('cfm').textContent=mm;document.getElementById('cfo').classList.add('on');document.getElementById('cfk').onclick=function(){cfClose(true)};window._cfcb=cb}
function cfClose(ok){document.getElementById('cfo').classList.remove('on');if(ok&&window._cfcb)window._cfcb();window._cfcb=null}

function api(path,pr,cb){
  var u=API+'?action='+path;
  var o={method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'}};
  if(pr) o.body=Object.entries(pr).map(function(kv){return kv[0]+'='+encodeURIComponent(kv[1])}).join('');
  fetch(u,o).then(function(r){return r.json()}).then(cb).catch(function(){toast('无法连接服务,请检查模块状态','er');document.getElementById('gl').innerHTML='<div class="emp"><div class="em">😿</div><div class="tx">服务未启动</div></div>'})
}

function gicon(n){
  var m={sgame:{e:'👑',b:'#FFF0E0'},pubgm:{e:'🔫',b:'#E8F5E9'},cf:{e:'💣',b:'#FFEBEE'},speed:{e:'🏎️',b:'#E3F2FD'},cod:{e:'🎯',b:'#F3E5F5'},jkchess:{e:'♟️',b:'#FFF8E1'},lolm:{e:'⚔️',b:'#E0F7FA'},kihan:{e:'🍥',b:'#FFF3E0'},wuxia:{e:'🌸',b:'#FCE4EC'}};
  return m[n]||{e:'🎮',b:'#F5F5F5'}
}

function loadGames(){
  api('detect',0,function(d){
    var gs=d.games||[],i=gs.filter(function(g){return g.installed}),n=gs.filter(function(g){return !g.installed}),h='';
    if(!i.length)h+='<div class="emp"><div class="em">🎮</div><div class="tx">未检测到已安装的腾讯手游</div></div>';
    i.forEach(function(g){var ic=gicon(g.name);var lb=g.clone?' · 分身':'';var pt=g.path||'';var cj=''+!!g.clone;h+='<div class="gc" onclick="openGame(\''+g.name+'\',\''+g.display+lb+'\',\''+(g.size||'0')+'\',\''+pt+'\','+cj+')"><div class="gt"><div class="gi" style="background:'+ic.b+'">'+ic.e+'</div><div style="flex:1"><div class="gn">'+g.display+lb+'</div><div class="gm">'+g.pkg+' · 数据: '+(g.size||'0')+'</div></div><span class="bdg bok">'+(g.clone?'分身':'已安装')+'</span><span class="arr">›</span></div></div>'});
    if(n.length){h+='<div style="font-size:11px;color:#C0B8C8;margin:14px 0 6px;font-weight:600">未安装</div>';n.forEach(function(g){h+='<div class="gc" style="opacity:0.5;cursor:default"><div class="gt"><div class="gi" style="background:#F0F0F0">❓</div><div style="flex:1"><div class="gn">'+g.display+'</div><div class="gm">'+g.pkg+'</div></div><span class="bdg bno">未安装</span></div></div>'})}
    document.getElementById('gl').innerHTML=h;
  })
}

function openGame(nm,dp,sz,pt,cl){
  cg=nm;cgd=dp;cgpt=pt||'';cgcl=!!cl;var ic=gicon(nm);
  document.getElementById('pg').style.display='none';document.getElementById('pd').classList.add('on');
  document.getElementById('dn').textContent=ic.e+' '+dp;document.getElementById('dm').textContent='数据大小: '+sz;
  loadDetail()
}

function back(){document.getElementById('pd').classList.remove('on');document.getElementById('pg').style.display='';loadGames()}

function loadDetail(){
  var ct=document.getElementById('dc');ct.innerHTML='<div class="ld"><div class="sp"></div><div class="lt">加载中...</div></div>';
  api('accounts',{game:cg},function(d){
    var ac=d.accounts||[],h='';
    h+='<button class="btn bp" onclick="doBackup()">📦 备份当前账号</button>';
    h+='<div class="as"><div class="ast">📋 已备份账号 ('+ac.length+')</div>';
    if(!ac.length)h+='<div class="emp"><div class="em">📭</div><div class="tx">还没有备份过账号</div></div>';
    else ac.forEach(function(a){h+='<div class="ai"><div class="ail"><div class="aan">'+a.alias+'</div><div class="aam">'+a.time+' · '+a.size+'</div></div><div class="aia"><button class="btn bm bsm" onclick="doSwitch(\''+a.alias+'\')">切换</button><button class="btn bc bsm" onclick="doDel(\''+a.alias+'\')">删除</button></div></div>'});
    h+='</div>';ct.innerHTML=h
  })
}

function doBackup(){
  var a=prompt('💕 为当前账号取个名字:');if(!a||!a.trim())return;a=a.trim();
  document.getElementById('dc').innerHTML='<div class="ld"><div class="sp"></div><div class="lt">正在备份...</div></div>';
  var bd={game:cg,alias:a};if(cgpt)bd.path=cgpt;api('backup',bd,function(d){if(d.ok){toast('备份成功: '+a,'ok');loadDetail()}else{toast(d.error||'失败','er');loadDetail()}})
}

function doSwitch(al){
  cfShow('切换账号','确认切换到「'+al+'」？<br>切换前会自动备份当前数据。',function(){
    document.getElementById('dc').innerHTML='<div class="ld"><div class="sp"></div><div class="lt">正在切换...</div></div>';
    api('restore',{alias:al},function(d){if(d.ok){toast('已切换: '+al,'ok');loadDetail()}else{toast(d.error||'失败','er');loadDetail()}})
  })
}

function doDel(al){
  cfShow('删除账号','确认删除「'+al+'」？<br>此操作不可恢复。',function(){
    api('delete',{alias:al},function(d){if(d.ok){toast('已删除: '+al,'ok');loadDetail()}else{toast(d.error||'失败','er');loadDetail()}})
  })
}

// AI
function aiOpen(){document.getElementById('aip').classList.add('on');document.querySelector('.fab').style.display='none';api('ai/config',{op:'get'},function(d){if(d.configured){aiOk=true;document.getElementById('aicf').classList.remove('on')}else{aiOk=false;document.getElementById('aicf').classList.add('on')}})}
function aiClose(){document.getElementById('aip').classList.remove('on');document.querySelector('.fab').style.display='flex'}
function aiSave(){var k=document.getElementById('aik').value.trim();if(!k){toast('请输入 Key','er');return}api('ai/config',{op:'set',key:k},function(d){if(d.ok){aiOk=true;document.getElementById('aicf').classList.remove('on');toast('已保存','ok');aiAdd('b','配置成功~ 现在可以用自然语言管理账号啦 💕')}else toast(d.error||'失败','er')})}
function aiDelCfg(){cfShow('清除配置','确认清除 API Key？',function(){api('ai/config',{op:'delete'},function(d){aiOk=false;document.getElementById('aik').value='';toast('已清除','ok')})})}
function aiAdd(r,c,e){var ch=document.getElementById('ach');var d=document.createElement('div');d.className='abb '+(r==='u'?'u':(e?'e':'b'));d.innerHTML=c.replace(/\n/g,'<br>');ch.appendChild(d);ch.scrollTop=ch.scrollHeight}
function aiSend(){var i=document.getElementById('ait');var m=i.value.trim();if(!m)return;i.value='';aiAdd('u',m);if(!aiOk){aiAdd('b','请先点击 ⚙ 配置 API Key',true);return}aiTyping();api('ai/chat',{msg:m},function(d){aiHideTyping();if(d.error){aiAdd('b','错误: '+d.error,true);return}if(d.choices&&d.choices[0]&&d.choices[0].message){var r=d.choices[0].message.content;aiAdd('b',r);aiPCmd(r)}else aiAdd('b','返回异常',true)})}
function aiTyping(){var ch=document.getElementById('ach');var d=document.createElement('div');d.id='ty';d.innerHTML='<div class="abb b" style="color:#C0B8C8;font-size:11px">思考中...</div>';ch.appendChild(d);ch.scrollTop=ch.scrollHeight}
function aiHideTyping(){var e=document.getElementById('ty');if(e)e.remove()}
function aiPCmd(t){var m=t.match(/\{[^}]*"cmd"[^}]*\}/);if(!m)return;try{var c=JSON.parse(m[0]);if(!c.cmd||c.cmd==='chat')return;if(c.cmd==='switch'||c.cmd==='restore'){if(!c.alias)return;aiAdd('b','正在切换...');api('restore',{alias:c.alias},function(d){if(d.ok)aiAdd('b','已切换到: '+c.alias);else aiAdd('b','切换失败','e')})}else if(c.cmd==='backup'){if(!c.game||!c.alias)return;aiAdd('b','正在备份...');api('backup',{game:c.game,alias:c.alias},function(d){if(d.ok)aiAdd('b','备份成功: '+c.alias);else aiAdd('b','备份失败','e')})}else if(c.cmd==='list'){api('accounts',{},function(d){if(d.accounts&&d.accounts.length){var l=d.accounts.map(function(a){return a.alias+' ('+a.display+')'}).join('<br>');aiAdd('b','已备份:<br>'+l)}else aiAdd('b','暂无备份')})}else if(c.cmd==='detect'){api('detect',{},function(d){if(d.games){var i=d.games.filter(function(g){return g.installed}).map(function(g){return g.display}).join(', ');aiAdd('b','已安装: '+(i||'无'))}})}else if(c.cmd==='delete')aiAdd('b','删除操作请在游戏详情页手动确认')}catch(e){}}

loadGames();
</script>
</body>
</html>
